<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sparkie</title></head>
<body><main class="lab">
<header><a class="brand" href="/" aria-label="Sparkie 首页"><span>✳</span> sparkie</a><span id="state" role="status">准备就绪</span></header>
<section class="hero"><p class="eyebrow">LET’S THINK TOGETHER</p><h1>聊着，把事情做了。</h1><p>随时开口，复杂的事交给我。</p></section>
<section class="session"><form id="setup"><div class="voice-stage"><div class="voice-orb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v4M8 23h8"/></svg></div><div class="meter" aria-label="麦克风电平"><div id="level"></div></div><p id="notice" role="status">准备好就开口</p><div class="actions"><button id="start" type="submit">开始对话</button><button id="stop" type="button" class="secondary" hidden>结束对话</button><button id="mute" type="button" class="secondary" aria-pressed="false" hidden>静音</button><button id="recover" type="button" class="secondary" hidden>恢复麦克风</button><button id="interrupt" type="button" class="quiet" hidden>打断</button></div></div>
<details class="settings-drawer"><summary>设置</summary><p><a href="/multitrack.html">双人讨论测试</a></p><div class="settings">
<label>转写语言<select name="language"><option value="en">English</option><option value="zh-CN">中文</option></select></label>
<label>麦克风<select name="inputDevice"><option value="">系统默认</option></select></label>
<label>时长<select name="seconds"><option value="0">手动结束</option><option value="300">5 分钟</option><option value="120">2 分钟</option><option value="30">30 秒</option></select></label>
</div><button id="devices" type="button" class="quiet">刷新设备</button><p class="privacy">音频由 OpenAI、Deepgram 处理；转写和任务结果保存在本机。</p></details></form><p id="error" role="alert"></p></section>
<div class="columns"><section class="panel"><div class="section-title"><h2>对话</h2><button id="export" class="quiet">导出</button></div><div id="conversation" class="feed"><p class="empty">从一句话开始。</p></div></section>
<section class="panel"><div class="section-title"><h2>后台任务</h2><span id="task-count">0</span></div><div id="tasks"><p class="empty">需要深入思考的事，交给我。</p></div></section></div>
</main><script type="module" src="/src/realtime.js"></script></body></html>
