<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkie · Workspace</title>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="brand" href="/" aria-label="Sparkie home"><span>✳</span> sparkie</a>
    <form id="join" class="join-bar" aria-label="Join meeting">
      <input name="server" class="server-input" value="127.0.0.1:8790" title="Backend address" aria-label="Backend address">
      <input name="external_id" class="meeting-input" placeholder="Zoom meeting ID" required aria-label="Zoom meeting ID">
      <button type="submit">Join</button>
    </form>
    <div class="topbar-meta">
      <span class="ws-chip" title="Workspace ID"><em>WS</em><span id="ws-id">—</span></span>
      <span id="state" role="status">Not connected</span>
    </div>
  </header>
  <p id="error" role="alert"></p>

  <main class="app-body">

    <div id="workspace" class="workspace" hidden>

      <div class="main-col">
        <section id="artifact-generating" class="generation-progress" aria-live="polite" aria-label="Document generation" hidden></section>

        <section class="panel stage-panel">
          <div class="section-title">
            <h2>Current artifact<span class="hint">STAGE</span></h2>
            <span class="live-dot">Presenting</span>
          </div>
          <div id="stage" class="stage-body">
            <p class="empty">Say “Sparkie, show us …” to present output here.</p>
          </div>
        </section>

        <section class="panel transcript-panel">
          <div class="section-title">
            <h2>Transcript<span class="hint">LIVE</span></h2>
            <span class="count"><span id="utterance-count">0</span> lines</span>
          </div>
          <div id="transcript" class="feed">
            <p class="empty">Waiting for transcript input.</p>
          </div>
          <form id="simulate" aria-label="Simulate speech">
            <input name="speaker" value="You" aria-label="Speaker">
            <input name="text" placeholder="Simulate a line, e.g. Sparkie, research related work" required>
            <button>Send</button>
          </form>
        </section>

      </div>

      <aside class="rail">

        <section class="panel list-panel tasks-panel">
          <div class="section-title">
            <h2>Tasks<span class="hint">TASKS</span></h2>
            <span class="count"><span id="task-count">0</span></span>
          </div>
          <div id="tasks" class="list">
            <p class="empty">Delegated work queues up here.</p>
          </div>
        </section>

        <section class="panel list-panel artifacts-panel">
          <div class="section-title">
            <h2>Artifacts<span class="hint">OUTPUT</span></h2>
            <span class="count"><span id="artifact-count">0</span></span>
          </div>
          <div id="artifacts" class="list">
            <p class="empty">Finished tasks produce artifacts.</p>
          </div>
        </section>

      </aside>

    </div>

  </main>
</div>

<div id="artifact-overlay" hidden aria-label="Fullscreen presentation">
  <div id="overlay-card"></div>
  <button id="overlay-return" type="button">← Back to workspace · Esc</button>
</div>
<script type="module" src="/src/workspace.js"></script>
</body>
</html>
