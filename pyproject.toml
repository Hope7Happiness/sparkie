[project]
name = "sparkie"
version = "0.1.0"
description = "Realtime AI meeting assistant with Zoom, Deepgram and background task workers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "websockets>=15,<16",
    "python-dotenv>=1,<2",
    "sounddevice>=0.5,<0.6",
    "soxr>=1.0,<2",
    "numpy>=1.26,<3",
]

[project.scripts]
sparkie = "sparkie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkie"]
